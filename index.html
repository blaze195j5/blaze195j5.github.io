<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Музыкальное слайдшоу с эффектом дождя и будущим мужем</title>

<!-- Романтический шрифт -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet" />

<style>
  /* Сброс и базовые стили */
  body, html {
    margin: 0; padding: 0; height: 100%;
    background: #1e2a38;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    user-select: none;
  }

  button {
    padding: 15px 30px;
    font-size: 24px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(135deg, #6dd5fa, #2980b9);
    color: white;
    cursor: pointer;
    box-shadow: 0 8px 15px rgba(41,128,185,0.4);
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    margin: 20px 0;
  }
  button:hover {
    background: linear-gradient(135deg, #2980b9, #6dd5fa);
    box-shadow: 0 12px 20px rgba(41,128,185,0.6);
  }

  /* Текст с анимацией печати */
  #message, #message2 {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Dancing Script', cursive;
    font-weight: 600;
    font-size: 30px;
    white-space: nowrap;
    overflow: hidden;
    color: #ff69b4;
    user-select: none;
    pointer-events: none;
    text-align: center;
    box-sizing: border-box;
    min-width: 300px;
  }

  #message2 {
    color: #00bfff;
  }

  /* Курсор через ::after */
  #message.typing::after,
  #message2.typing::after {
    content: "";
    display: inline-block;
    width: 3px;
    height: 1em;
    margin-left: 2px;
    background-color: currentColor;
    animation: blink-caret 0.75s step-end infinite;
    vertical-align: bottom;
  }

  @keyframes blink-caret {
    from, to { opacity: 0; }
    50% { opacity: 1; }
  }

  /* Слайдшоу */
  #slideshow, #slideshow2 {
    position: relative;
    width: 80vw;
    max-width: 800px;
    height: 450px;
    margin-top: 80px;
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.7);
    background: rgba(255 255 255 / 0.05);
    backdrop-filter: blur(15px);
  }

  #slideshow img, #slideshow2 img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center center;
    border-radius: 25px;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
    opacity: 0;
    transition: opacity 1s ease;
    background-color: transparent;
  }

  #slideshow img.active, #slideshow2 img.active {
    opacity: 1;
  }

  /* Эффект дождя из смайликов */
  #rain {
    pointer-events: none;
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    z-index: 9999;
  }

  .drop {
    position: absolute;
    top: -50px;
    font-size: 24px;
    user-select: none;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    opacity: 0.8;
    filter: drop-shadow(0 0 2px rgba(0,0,0,0.5));
  }

  @keyframes fall {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 0.8;
    }
    80% {
      opacity: 0.8;
    }
    100% {
      transform: translateY(110vh) rotate(360deg);
      opacity: 0;
    }
  }
</style>
</head>
<body>

<button id="startBtn">нажми меня</button>

<div id="message"></div>

<div id="slideshow" style="display:none;"></div>

<div id="rain"></div>

<button id="husbandBtn" style="display:none;">Нажми если хочешь увидеть своего будущего мужа</button>

<div id="message2" style="display:none;"></div>

<div id="slideshow2" style="display:none;"></div>

<audio id="audio" loop></audio>

<script>
  // Первый звук (как и был)
  const musicURL1 = 'https://www.myinstants.com/media/sounds/na-podarok.mp3';

  // Второй звук (отдельный, можно заменить)
  const musicURL2 = 'https://www.myinstants.com/media/sounds/na-podarok2.mp3';

  // Первый набор изображений
  const images1 = [
    'https://i.ibb.co/zWk0Kv2J/image.png',
    'https://i.ibb.co/fzVkRyxn/image.png',
    'https://i.ibb.co/Tq0wFYh9/image.png',
    'https://i.ibb.co/Rkv5Z6jf/image.png',
    'https://i.ibb.co/Mq1DTQ9/image.png',
    'https://i.ibb.co/vxhfbCyH/image.png',
    'https://i.ibb.co/cKYZqNFB/image.png'
  ];

  // Второй набор изображений (отдельный массив, ссылки те же, но можно менять)
  const images2 = [
    'https://i.ibb.co/3YckFmcP/image.png',
    'https://i.ibb.co/jPG4zv49/image.png',
    'https://i.ibb.co/7xGY4cBb/image.png',
    'https://i.ibb.co/VchpFFYJ/image.png',
    'https://i.ibb.co/xt5H1n6D/image.png',
    'https://i.ibb.co/CpMMHCBd/image.png',
    'https://i.ibb.co/3YckFmcP/image.png'
  ];

  const startBtn = document.getElementById('startBtn');
  const husbandBtn = document.getElementById('husbandBtn');
  const audio = document.getElementById('audio');
  const slideshow = document.getElementById('slideshow');
  const slideshow2 = document.getElementById('slideshow2');
  const rain = document.getElementById('rain');
  const message = document.getElementById('message');
  const message2 = document.getElementById('message2');

  let slideInterval1;
  let slideInterval2;
  let totalCycles1 = 0;
  let totalCycles2 = 0;

  function createSlides(container, images) {
    container.innerHTML = '';
    images.forEach((src, i) => {
      const img = document.createElement('img');
      img.src = src;
      if(i === 0) img.classList.add('active');
      container.appendChild(img);
    });
  }

  function startSlideshow(container, onCompleteCycle) {
    let index = 0;
    const imgs = container.querySelectorAll('img');

    const interval = setInterval(() => {
      imgs[index].classList.remove('active');
      index++;
      if(index >= imgs.length) {
        index = 0;
        if(onCompleteCycle) onCompleteCycle();
      }
      imgs[index].classList.add('active');
    }, 4500);

    return interval;
  }

  function createRain(emojis) {
    rain.innerHTML = '';
    const dropsCount = 40;

    for(let i = 0; i < dropsCount; i++) {
      const drop = document.createElement('div');
      drop.classList.add('drop');
      drop.style.left = Math.random() * 100 + 'vw';
      drop.style.animationDuration = (5 + Math.random() * 5) + 's';
      drop.style.fontSize = (16 + Math.random() * 24) + 'px';
      drop.style.animationDelay = (Math.random() * 10) + 's';
      drop.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      rain.appendChild(drop);
    }
    rain.style.display = 'block';
  }

  function typeText(element, text, delay, callback) {
    element.textContent = '';
    element.classList.add('typing');
    let index = 0;

    function addChar() {
      if(index < text.length) {
        element.textContent += text.charAt(index);
        index++;
        setTimeout(addChar, delay);
      } else {
        element.classList.remove('typing');
        if(callback) callback();
      }
    }

    addChar();
  }

  startBtn.addEventListener('click', () => {
    audio.src = musicURL1;
    audio.play().catch(e => console.log('Ошибка воспроизведения аудио:', e));

    startBtn.style.display = 'none';

    slideshow.style.display = 'block';
    createSlides(slideshow, images1);
    createRain(['🍃', '❤️']); // дождь для первого слайдшоу

    typeText(message, "Самой красивой девочке", 200);

    totalCycles1 = 0;
    slideInterval1 = startSlideshow(slideshow, () => {
      totalCycles1++;
      if(totalCycles1 >= 1) {
        endFirstPhase();
      }
    });
  });

  function endFirstPhase() {
    clearInterval(slideInterval1);

    slideshow.style.display = 'none';
    rain.innerHTML = '';
    rain.style.display = 'none';

    message.textContent = '';
    message.style.opacity = '0';

    audio.pause();
    audio.currentTime = 0;

    husbandBtn.style.display = 'inline-block';
  }

  husbandBtn.addEventListener('click', () => {
    husbandBtn.style.display = 'none';

    slideshow2.style.display = 'block';
    message2.style.display = 'block';

    createSlides(slideshow2, images2);

    audio.src = musicURL2;
    audio.currentTime = 0;
    audio.play().catch(e => console.log('Ошибка воспроизведения аудио:', e));

    createRain(['💙', '🖤']); // дождь для второго слайдшоу

    typeText(message2, "а вот и твой муж", 200);

    totalCycles2 = 0;
    slideInterval2 = startSlideshow(slideshow2, () => {
      totalCycles2++;
      if(totalCycles2 >= 1) {
        endSecondPhase();
      }
    });
  });

  function endSecondPhase() {
    clearInterval(slideInterval2);

    audio.pause();
    audio.currentTime = 0;

    rain.innerHTML = '';
    rain.style.display = 'none';

    // Перезагрузка страницы для сброса интерфейса
    location.reload();
  }
</script>

</body>
</html>
